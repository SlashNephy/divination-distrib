name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'plugins/**'
      - '!plugins/master.json'

  # schedule:
  #   - cron:  '0 * * * *'

  workflow_dispatch:

concurrency:
  group: ci

jobs:
  update-plugin-master:
    runs-on: ubuntu-latest
    steps:
      # 自リポジトリに限定した、有効期限 1 時間のトークンを発行する。
      # ジョブ終了時に post ステップが自動で revoke する。
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liyjT3RUuzI5oVIL # divination-deploy
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26

      - uses: chetan/git-restore-mtime-action@cbf8161ddb4e9b162409104954fb540e8a38c1da # v2.1.1

      - name: Generate Plugin Master
        run: |
          go install github.com/SlashNephy/divination-plugin-master-generator@latest
          divination-plugin-master-generator

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 🪄 Generate Plugin Master
          author: divination-deploy[bot] <331637559+divination-deploy[bot]@users.noreply.github.com>
          branch: ci/update-plugin-master
          branch-suffix: random
          delete-branch: true
          title: 🪄 Generate Plugin Master
          labels: automerge

      - name: Automerge
        if: steps.create-pull-request.outputs.pull-request-number
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{  steps.create-pull-request.outputs.pull-request-number }}
