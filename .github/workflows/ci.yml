name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'plugins/**'
      - '!plugins/master.json'

  # schedule:
  #   - cron:  '0 * * * *'

  workflow_dispatch:

concurrency:
  group: ci

permissions:
  # to dispatch this workflow again when the push is rejected
  actions: write
  contents: read

jobs:
  update-plugin-master:
    runs-on: ubuntu-latest
    steps:
      # Mint a 1-hour token scoped to this repository.
      # The post step revokes it when the job ends.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liyjT3RUuzI5oVIL # divination-deploy
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write

      # Generate from the latest master rather than the commit that triggered this run, so that a run never pushes a
      # master.json older than the plugins already on master. Runs are serialized by the concurrency group.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26

      - uses: chetan/git-restore-mtime-action@cbf8161ddb4e9b162409104954fb540e8a38c1da # v2.1.1

      - name: Generate Plugin Master
        run: |
          go install github.com/SlashNephy/divination-plugin-master-generator@latest
          divination-plugin-master-generator

      # Push directly instead of opening a pull request: pull requests generated from different commits conflicted
      # with each other on master.json, and the later one was left unmerged.
      - name: Push Plugin Master
        run: |
          git add plugins/master.json
          if git diff --cached --quiet; then
            echo "master.json is up to date."
            exit 0
          fi

          git config user.name 'divination-deploy[bot]'
          git config user.email '331637559+divination-deploy[bot]@users.noreply.github.com'
          git commit -m '🪄 Generate Plugin Master'

          if ! git push origin HEAD:master; then
            # master moved while generating. Generate again from the new master, after this run.
            echo "::warning::Push was rejected. Dispatching this workflow again."
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master
          fi
        env:
          GH_TOKEN: ${{ github.token }}
