name: 'Stale'

on:
  schedule:
    - cron: '0 0 * * *' # JST 09:00 every day
  workflow_dispatch:

jobs:
  close-automerge-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          close-pr-label: automerge
          days-before-pr-close: 1
          delete-branch: true
          repo-token: ${{ secrets.BOT_GITHUB_TOKEN }}
