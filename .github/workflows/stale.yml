name: 'Stale'

on:
  schedule:
    - cron: '0 0 * * *' # JST 09:00 every day
  workflow_dispatch:

permissions: {}

jobs:
  close-automerge-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write' # required by delete-branch
      pull-requests: 'write'
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          close-pr-label: automerge
          days-before-pr-close: 1
          delete-branch: true
