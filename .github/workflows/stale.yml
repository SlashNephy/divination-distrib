name: 'Stale'

on:
  schedule:
    - cron: '0 0 * * *' # JST 09:00 every day
  workflow_dispatch:

jobs:
  close-automerge-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          close-pr-label: automerge
          days-before-pr-close: 1
          delete-branch: true
          repo-token: ${{ secrets.BOT_GITHUB_TOKEN }}
